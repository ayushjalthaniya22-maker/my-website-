
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InstaConnect</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#fafafa;
  font-family:Arial,sans-serif;
  color:#222;
}
header{
  background:white;
  padding:15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  position:sticky;top:0;z-index:10;
}
.logo{
  font-size:26px;
  font-weight:bold;
  background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7);
  color:transparent;
  background-clip:text;
}
button{cursor:pointer;border:0}
.header-btn{font-size:23px;background:none}
.container{max-width:470px;margin:auto;padding:12px}
.stories{
  display:flex;gap:14px;overflow-x:auto;
  background:white;padding:15px;
  border:1px solid #eee;border-radius:10px;
}
.story{text-align:center;min-width:65px;font-size:12px}
.story img{
  width:58px;height:58px;border-radius:50%;
  padding:3px;border:3px solid #e1306c;
  object-fit:cover;
}
.post{
  background:white;margin-top:18px;
  border:1px solid #eee;border-radius:10px;
  overflow:hidden;
}
.post-head{
  display:flex;align-items:center;
  padding:12px;gap:10px;
}
.avatar{
  width:38px;height:38px;border-radius:50%;
  object-fit:cover;
}
.post-img{
  width:100%;max-height:500px;
  object-fit:cover;display:block;
}
.actions{padding:12px;display:flex;gap:17px}
.actions button{font-size:25px;background:none}
.liked{color:#ed2858}
.likes{padding:0 12px;font-weight:bold}
.caption{padding:9px 12px;font-size:14px}
.comments{padding:5px 12px;color:#888;font-size:13px}
.bottom{
  position:fixed;bottom:0;left:0;width:100%;
  display:flex;justify-content:space-around;
  background:white;border-top:1px solid #ddd;
  padding:13px;z-index:10;
}
.bottom button{background:none;font-size:24px}
.page{display:none;padding-bottom:80px}
.page.active{display:block}
.profile{text-align:center;padding:25px}
.profile img{
  width:95px;height:95px;border-radius:50%;
  object-fit:cover;
}
.stats{display:flex;justify-content:space-around;margin:25px 0}
.stats b{display:block;font-size:20px}
.create{
  background:white;padding:20px;
  border-radius:12px;margin-top:20px;
}
input,textarea{
  width:100%;padding:12px;margin:10px 0;
  border:1px solid #ddd;border-radius:7px;
}
.primary{
  background:#df347a;color:white;
  padding:12px 20px;border-radius:7px;
  width:100%;font-weight:bold;
}
.search-result{padding:15px;background:white;margin-top:10px}
</style>
</head>

<body>

<header>
  <div class="logo">InstaConnect</div>
  <div>
    <button class="header-btn" onclick="showPage('create')">＋</button>
    <button class="header-btn" onclick="showPage('chat')">✉</button>
  </div>
</header>

<div class="container">

<!-- HOME -->
<section id="home" class="page active">

<div class="stories">
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=12">
    <p>Your story</p>
  </div>
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=5">
    <p>Rahul</p>
  </div>
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=9">
    <p>Priya</p>
  </div>
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=15">
    <p>Aman</p>
  </div>
  <div class="story">
    <img src="https://i.pravatar.cc/100?img=20">
    <p>Neha</p>
  </div>
</div>

<div id="feed"></div>
</section>

<!-- SEARCH -->
<section id="search" class="page">
<h2>Search 🔍</h2>
<input id="searchInput" placeholder="Search posts or users..." oninput="searchPosts()">
<div id="searchResults"></div>
</section>

<!-- CREATE -->
<section id="create" class="page">
<h2>Create New Post 📸</h2>
<div class="create">
  <input id="username" placeholder="Your username">
  <input id="photo" type="file" accept="image/*">
  <textarea id="caption" placeholder="Write a caption..."></textarea>
  <button class="primary" onclick="addPost()">Share Post</button>
  <p id="message" style="margin-top:12px"></p>
</div>
</section>

<!-- CHAT -->
<section id="chat" class="page">
<h2>Messages 💬</h2>
<div class="search-result">
  <h3>Rahul</h3>
  <p>Hey! How are you?</p>
  <button onclick="chatDemo()">Reply</button>
</div>
<div class="search-result">
  <h3>Priya</h3>
  <p>Hello 👋</p>
  <button onclick="chatDemo()">Reply</button>
</div>
</section>

<!-- PROFILE -->
<section id="profile" class="page">
<div class="profile">
<img src="https://i.pravatar.cc/150?img=12">
<h2 id="profileName">My Profile</h2>
<p>@myaccount</p>
<div class="stats">
<div><b id="postCount">0</b>Posts</div>
<div><b>120</b>Followers</div>
<div><b>180</b>Following</div>
</div>
<button class="primary" onclick="editProfile()">Edit Profile</button>
</div>
<h3>My Posts</h3>
<div id="myPosts"></div>
</section>

</div>

<nav class="bottom">
<button onclick="showPage('home')">🏠</button>
<button onclick="showPage('search')">🔍</button>
<button onclick="showPage('create')">➕</button>
<button onclick="showPage('chat')">💬</button>
<button onclick="showPage('profile')">👤</button>
</nav>

<script>

let posts = JSON.parse(localStorage.getItem('instaPosts') || '[]');

const demoPosts = [
{
 user:"Rahul",
 img:"https://picsum.photos/id/1011/600/600",
 caption:"Beautiful nature 🌿",
 likes:125,
 liked:false
},
{
 user:"Priya",
 img:"https://picsum.photos/id/1025/600/600",
 caption:"Enjoying my day ❤️",
 likes:89,
 liked:false
}
];

function save(){
 localStorage.setItem('instaPosts',JSON.stringify(posts));
}

function showPage(id){
 document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
 document.getElementById(id).classList.add('active');
 if(id==='profile') updateProfile();
}

function renderPosts(){
 const feed=document.getElementById('feed');
 feed.innerHTML='';
 [...posts,...demoPosts].forEach((p,i)=>{
  let index=i;
  let el=document.createElement('div');
  el.className='post';

  el.innerHTML=`
   <div class="post-head">
    <img class="avatar" src="https://i.pravatar.cc/100?u=${encodeURIComponent(p.user)}">
    <b>${escapeHTML(p.user)}</b>
   </div>
   <img class="post-img" src="${p.img}">
   <div class="actions">
    <button class="${p.liked?'liked':''}" onclick="likePost(${index})">♥</button>
    <button onclick="commentPost(${index})">💬</button>
    <button onclick="sharePost(${index})">↗</button>
   </div>
   <div class="likes">${p.likes} likes</div>
   <div class="caption"><b>${escapeHTML(p.user)}</b> ${escapeHTML(p.caption)}</div>
   <div class="comments">View comments</div>
  `;
  feed.appendChild(el);
 });
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 '&':'&amp;','<':'&lt;','>':'&gt;',
 '"':'&quot;',"'":'&#39;'
 }[c]));
}

function likePost(i){
 let all=[...posts,...demoPosts];
 all[i].liked=!all[i].liked;
 all[i].likes+=all[i].liked?1:-1;
 if(i<posts.length) save();
 renderPosts();
}

function commentPost(i){
 let comment=prompt("Write your comment:");
 if(comment) alert("Comment added locally: "+comment);
}

function sharePost(i){
 alert("Post selected for sharing!");
}

function addPost(){
 let file=document.getElementById('photo').files[0];
 let user=document.getElementById('username').value.trim() || "You";
 let caption=document.getElementById('caption').value.trim();

 if(!file){
  document.getElementById('message').innerText="Please select a photo!";
  return;
 }

 if(!file.type.startsWith('image/')){
  document.getElementById('message').innerText="Please choose an image.";
  return;
 }

 if(file.size>2*1024*1024){
  document.getElementById('message').innerText="Image must be under 2 MB.";
  return;
 }

 let reader=new FileReader();
 reader.onload=function(){
  posts.unshift({
   user:user,
   img:reader.result,
   caption:caption,
   likes:0,
   liked:false
  });
  try{
   save();
  }catch(e){
   posts.shift();
   document.getElementById('message').innerText="Storage full. Try a smaller image.";
   return;
  }
  renderPosts();
  document.getElementById('photo').value='';
  document.getElementById('caption').value='';
  document.getElementById('message').innerText="Post shared successfully!";
  showPage('home');
 };
 reader.readAsDataURL(file);
}

function searchPosts(){
 let q=document.getElementById('searchInput').value.toLowerCase();
 let results=document.getElementById('searchResults');
 results.innerHTML='';
 [...posts,...demoPosts].filter(p=>
  p.user.toLowerCase().includes(q) ||
  p.caption.toLowerCase().includes(q)
 ).forEach(p=>{
  let d=document.createElement('div');
  d.className='search-result';
  d.textContent=p.user+" — "+p.caption;
  results.appendChild(d);
 });
}

function updateProfile(){
 document.getElementById('postCount').innerText=posts.length;
 document.getElementById('myPosts').innerHTML='';
 posts.forEach(p=>{
  let img=document.createElement('img');
  img.src=p.img;
  img.style.width='100%';
  img.style.marginTop='10px';
  document.getElementById('myPosts').appendChild(img);
 });
}

function editProfile(){
 let name=prompt("Enter your profile name:");
 if(name){
  document.getElementById('profileName').innerText=name;
 }
}

function chatDemo(){
 let reply=prompt("Write a demo message:");
 if(reply) alert("Demo message: "+reply);
}

renderPosts();

</script>
</body>
</html>
